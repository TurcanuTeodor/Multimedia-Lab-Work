<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Dynamic Chart</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<div id="controls">
    <button id="toggle">Pause</button>

    <label>
        Speed (ms)
        <input type="range" id="speed" min="200" max="2000" value="1000">
    </label>

    <label>
        Min
        <input type="number" id="minVal" value="0">
    </label>

    <label>
        Max
        <input type="number" id="maxVal" value="600">
    </label>

    <label>
        <input type="checkbox" id="grid" checked>
        Grid
    </label>

    <label>
        <input type="checkbox" id="smooth">
        Smooth
    </label>

    <label>
        Chart type
        <select id="chartType">
            <option value="line">Line</option>
            <option value="bar">Bar</option>
            <option value="area">Area</option>
            <option value="scatter">Scatter</option>
        </select>
    </label>

    <label>
        Theme
        <select id="theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="contrast">Contrast</option>
        </select>
    </label>

    <button id="reset">Reset</button>
    <button id="export">Export PNG</button>
</div>

<canvas id="chartCanvas" width="900" height="600"></canvas>

<div id="stats">
    <p>Current: <span id="cur">-</span></p>
    <p>Min: <span id="min">-</span></p>
    <p>Max: <span id="max">-</span></p>
    <p>Avg: <span id="avg">-</span></p>
    <p>Trend: <span id="trend">-</span></p>
</div>

<div id="tooltip"></div>

<script src="scripts/chart.js"></script>
</body>
</html>
